    ["本周销量环比", fmt(a.sales_wq, true), "较上周同期", vc(a.sales_wq)],
    ["本周订单", a.orders_w, "订单环比(周) " + fmt(a.orders_wq, true), ""],
    ["大唐EV已订", a.da_done, "目标 " + a.da_goal, ""],
    ["大唐完成率", fmt(a.da_rate), "差额 " + a.da_diff, ""],
  ];
  const box = k => `<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="d">${k[2]}</div></div>`;
  document.getElementById("kpis").innerHTML =
    kpis.slice(0, 6).map(box).join("") +
    `<div class="wide">${box(kpis[6])}${box(kpis[7])}</div>`;
}
function renderTrend() {
  const t = DATA.trend[activeEntity()] || DATA.trend["鲁东大区"];
  if (!trendChart) trendChart = ech(document.getElementById("ch-trend"));
  trendChart.setOption({
    grid: { left: 40, right: 12, top: 30, bottom: 24 },
    tooltip: { trigger: "axis" },
    xAxis: { type: "category", data: t.d },
    yAxis: { type: "value", splitLine: { lineStyle: { color: C.bd } } },
    series: [
      { name: "销量", type: "line", smooth: true, data: t.sales, itemStyle: { color: C.p }, label: { show: true, fontSize: 10 } },
      { name: "订单", type: "line", smooth: true, data: t.orders, itemStyle: { color: C.a }, label: { show: true, fontSize: 10 } },
    ]
  });
}
function renderGroup() {
  const g = DATA.group_rank[activeEntity()] || DATA.group_rank["鲁东大区"];
  if (!groupChart) groupChart = ech(document.getElementById("ch-group"));
  groupChart.setOption({
    grid: { left: 70, right: 16, top: 20, bottom: 20 },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
    legend: { data: ["销量", "订单"], top: 0 },
    xAxis: { type: "value", splitLine: { lineStyle: { color: C.bd } } },
    yAxis: { type: "category", inverse: true, data: g.map(x => x.name) },
    series: [
      { name: "销量", type: "bar", data: g.map(x => x.sales), itemStyle: { color: C.p }, label: { show: true, position: "right", fontSize: 10 } },
      { name: "订单", type: "bar", data: g.map(x => x.orders), itemStyle: { color: C.a }, label: { show: true, position: "right", fontSize: 10 } },
    ]
  });
}
function renderAll() {
  renderKpis(); renderTrend(); renderGroup(); renderTables(); renderSeriesAll();
}
// 大唐表
function lv(r) { return r["层级"] === "经销商" ? (r["归属城市"] || "经销商") : r["层级"]; }
function datangTable(dom, data) {
  let h = "<table><tr><th>层级</th><th>名称</th><th>目标</th><th>已订</th><th>完成率</th><th>差额</th></tr>";
  h += data.map(r => `<tr><td>${esc(lv(r))}</td><td>${esc(r["名称"])}</td><td>${r["目标"]}</td><td>${r["已订"]}</td><td>${fmt(r["完成率"])}</td><td>${r["差额"]}</td></tr>`).join("");
  dom.innerHTML = h + "</table>";
}

// 对比表（层级：大区→区域→城市→集团→单店，每层已按本期降序）
function cmpTable(dom, rows) {
  let h = "<table><tr><th>层级</th><th>名称</th><th>本期</th><th>同期</th><th>环比</th></tr>";
  h += rows.map(r => `<tr><td>${esc(lv(r))}</td><td>${esc(r["名称"])}</td><td>${r["本期"]}</td><td>${r["同期"]}</td><td>${fmt(r["qoq"], true)}</td></tr>`).join("");
  dom.innerHTML = h + "</table>";
}
// 筛选状态（按归属）
const S = { region: "全部", city: "全部", group: "全部" };
function fRows(rows) {
  return rows.filter(r =>
    (S.region === "全部" || r["归属区域"] === S.region) &&
    (S.city === "全部" || r["归属城市"] === S.city) &&
    (S.group === "全部" || r["归属集团"] === S.group));
}
function fDatang(rows) {
  return rows.filter(r =>
    (S.region === "全部" || !r["归属区域"] || r["归属区域"] === S.region) &&
    (S.city === "全部" || !r["归属城市"] || r["归属城市"] === S.city) &&
    (S.group === "全部" || !r["归属集团"] || r["归属集团"] === S.group));
}
function renderTables() {
  cmpTable(document.getElementById("t-sales-m"), fRows(DATA.sales_month));
  cmpTable(document.getElementById("t-sales-w"), fRows(DATA.sales_week));
  cmpTable(document.getElementById("t-orders-m"), fRows(DATA.orders_month));
  cmpTable(document.getElementById("t-orders-w"), fRows(DATA.orders_week));
  datangTable(document.getElementById("t-datang"), fDatang(DATA.datang));
  datangTable(document.getElementById("t-datang2"), fDatang(DATA.datang));
}
function fillSel(id, vals) {
  const sel = document.getElementById(id);
  vals.forEach(v => { const o = document.createElement("option"); o.value = v; o.text = v; sel.appendChild(o); });
}
fillSel("f-region", DATA.dims.regions);
fillSel("f-city", DATA.dims.cities);
fillSel("f-group", DATA.dims.groups);
document.getElementById("f-region").onchange = e => { S.region = e.target.value; renderAll(); };
document.getElementById("f-city").onchange = e => { S.city = e.target.value; renderAll(); };
document.getElementById("f-group").onchange = e => { S.group = e.target.value; renderAll(); };
renderAll();   // 初始渲染
// 车系分布：只取本月；随城市联动（区域/集团不联动）；按绝对量从高到低
function seriesData(metric) {
  if (S.city !== "全部" && DATA.series_city[S.city]) return DATA.series_city[S.city][metric];
  return metric === "sales" ? DATA.series_sales : DATA.series_orders;
}
function seriesTitle(metric) {
  const scope = (S.city !== "全部") ? S.city + "市" : "鲁东大区";
  return scope + "月度车系" + (metric === "sales" ? "销量" : "订单") + "分布";
}
function renderSeries(dom, rows, color, titleDom, metric) {
  const c = (metric === "sales") ? (seriesChartS || (seriesChartS = ech(dom))) : (seriesChartO || (seriesChartO = ech(dom)));
  titleDom.textContent = seriesTitle(metric);
  c.setOption({
    grid: { left: 80, right: 30, top: 16, bottom: 24 },
    xAxis: { type: "value", splitLine: { lineStyle: { color: C.bd } } },
    yAxis: { type: "category", inverse: true, data: rows.map(r => r.name) },
    series: [{ type: "bar", data: rows.map(r => r.n), itemStyle: { color }, label: { show: true, position: "right", fontSize: 10, formatter: p => p.value + " (" + rows[p.dataIndex].pct + "%)" } }]
  });
}
function renderSeriesAll() {
  renderSeries(document.getElementById("ch-series-s"), seriesData("sales"), C.s, document.getElementById("t-series-s"), "sales");
  renderSeries(document.getElementById("ch-series-o"), seriesData("orders"), C.a, document.getElementById("t-series-o"), "orders");
}
// 原始明细（管理端）
// 导航
document.querySelectorAll(".nav").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + b.dataset.v));
});
window.addEventListener("resize", () => { document.querySelectorAll(".chart").forEach(c => echarts.getInstanceByDom(c)?.resize()); });
</script>
</body>
</html>
